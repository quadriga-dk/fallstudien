name: Update OER tile images

on:
  push:
    branches: [main]
  schedule:
    # Weekly check, in case a case study updates its logo without a push here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oer-tile-images
  cancel-in-progress: false

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sync images from the OER sites
        run: ./scripts/update-oer-images.sh

      - name: Commit changed images
        run: |
          if [ -z "$(git status --porcelain -- images)" ]; then
            echo "All images are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "chore: sync OER tile images"
          git push
